# nginx reverse proxy for Pabrika, with TLS. Replace pabrika.example.com (three places below)
# with your domain. Install this AFTER the certificate exists (see nginx-pabrika-http.conf):
#
#   sudo cp deploy/nginx-pabrika.conf /etc/nginx/sites-available/pabrika
#   sudo nginx -t && sudo systemctl reload nginx
#
# Why each directive matters is explained in docs/proxy.md.

# Port 80: keep serving the certificate challenge for renewals, redirect everything else.
server {
    listen 80;
    listen [::]:80;
    server_name pabrika.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx before 1.25.1 (Ubuntu 24.04 ships 1.24, Debian 12 ships 1.22) needs "http2" on the
    # listen line. On nginx 1.25.1 or newer remove "http2" from both lines and add "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pabrika.example.com;

    ssl_certificate     /etc/letsencrypt/live/pabrika.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pabrika.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    # The app also sends HSTS when BASE_URL is https; hide its copy so it is sent exactly once.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Live updates (server-sent events): no buffering, no compression, long read timeout.
    location ~ ^/api/v1/projects/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite, never append: the app trusts the first X-Forwarded-For hop (TRUST_PROXY=true).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        gzip off;
    }

    # MCP endpoint: some responses stream.
    location = /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        gzip off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
