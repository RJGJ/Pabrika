# nginx BOOTSTRAP for Pabrika: port 80 only, just enough for certbot to prove you own the domain.
# Use this first, get the certificate, then switch to nginx-pabrika.conf (which needs the
# certificate files to exist). Replace pabrika.example.com with your domain.
#
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/nginx-pabrika-http.conf /etc/nginx/sites-available/pabrika
#   sudo ln -sf /etc/nginx/sites-available/pabrika /etc/nginx/sites-enabled/pabrika
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d pabrika.example.com \
#        --deploy-hook "systemctl reload nginx"
#
# The --deploy-hook is remembered for automatic renewals (certbot installs a renewal timer).

server {
    listen 80;
    listen [::]:80;
    server_name pabrika.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
